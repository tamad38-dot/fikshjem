<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' blob: https://*.supabase.co; form-action 'none'; base-uri 'none'"
    />
    <title>FIX · Konto</title>
    <link rel="stylesheet" href="account.css" />
    <script src="model.js" defer></script>
    <script src="account.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <a href="/business/account.html" aria-label="FIX">♧ FIX</a
        ><span>FOR THE LOVE OF FOOD</span>
      </header>
      <section class="intro">
        <small>FIX I’M HUNGRY · PILOT</small>
        <h1 id="title"></h1>
        <p id="intro"></p>
      </section>
      <nav id="roles" aria-label="Account type">
        <button type="button" data-role="personal"></button
        ><button type="button" data-role="business"></button>
      </nav>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="auth" hidden>
        <div class="tabs">
          <button id="login-tab" type="button"></button
          ><button id="signup-tab" type="button"></button>
        </div>
        <form id="auth-form">
          <label
            ><span data-copy="email"></span
            ><input
              id="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              required /></label
          ><label
            ><span data-copy="password"></span
            ><input
              id="password"
              type="password"
              autocomplete="current-password"
              minlength="12"
              maxlength="128"
              required /></label
          ><label id="terms-row" class="check" hidden
            ><input id="terms" type="checkbox" /><span
              data-copy="termsConsent"
            ></span
          ></label>
          <div class="legal">
            <a
              href="/legal/terms.html"
              target="_blank"
              rel="noopener"
              data-copy="terms"
            ></a>
            ·
            <a
              href="/legal/privacy.html"
              target="_blank"
              rel="noopener"
              data-copy="privacy"
            ></a>
          </div>
          <button id="submit-auth" class="primary" type="submit"></button>
        </form>
        <button id="forgot" class="text" type="button"></button>
        <p class="muted" data-copy="memory"></p>
      </section>
      <section id="recovery" hidden>
        <h2 data-copy="newPassword"></h2>
        <form id="reset-form">
          <input
            id="reset-password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
            required
            aria-label="New password"
          /><button class="primary" type="submit" data-copy="save"></button>
        </form>
      </section>
      <section id="dashboard" hidden>
        <div class="row">
          <h2 id="account-title"></h2>
          <button
            id="logout"
            class="text"
            type="button"
            data-copy="logout"
          ></button>
        </div>
        <p id="personal-note" class="muted" hidden data-copy="personalNote"></p>
        <div id="business-editor" hidden>
          <p class="notice" data-copy="reviewNote"></p>
          <p id="review-status"></p>
          <form id="business-form">
            <label
              ><span data-copy="name"></span
              ><input name="name" maxlength="100" required /></label
            ><label
              ><span data-copy="address"></span
              ><input name="address" maxlength="200" required /></label
            ><label
              ><span data-copy="city"></span
              ><input name="city" maxlength="80" required /></label
            ><label
              ><span data-copy="website"></span
              ><input
                name="website"
                type="url"
                placeholder="https://"
                maxlength="500" /></label
            ><label
              ><span data-copy="description"></span
              ><textarea
                name="description"
                maxlength="600"
                rows="3"
              ></textarea></label
            ><label
              ><span data-copy="menu"></span
              ><textarea
                name="menu"
                maxlength="2000"
                rows="5"
              ></textarea></label
            ><label
              ><span data-copy="venue"></span
              ><select name="venue">
                <option value="restaurant">Restaurant</option>
                <option value="cafe">Café</option>
                <option value="cafeteria">Cafeteria</option>
                <option value="bakery">Bakery</option>
                <option value="dessert">Dessert</option>
              </select></label
            >
            <fieldset>
              <legend data-copy="food"></legend>
              <div id="foods" class="chips"></div>
            </fieldset>
            <details>
              <summary data-copy="coordinates"></summary>
              <p class="muted" data-copy="coordinatesNote"></p>
              <label
                >Latitude<input
                  name="latitude"
                  inputmode="decimal"
                  placeholder="59.74" /></label
              ><label
                >Longitude<input
                  name="longitude"
                  inputmode="decimal"
                  placeholder="10.20"
              /></label>
            </details>
            <button class="primary" type="submit" data-copy="save"></button>
          </form>
          <section class="photos">
            <h2 data-copy="photos"></h2>
            <p class="muted" data-copy="photoNote"></p>
            <label class="check"
              ><input id="rights" type="checkbox" /><span
                data-copy="rights"
              ></span></label
            ><label class="upload"
              ><span data-copy="upload"></span
              ><input
                id="file"
                type="file"
                accept="image/jpeg,image/png,image/webp"
                disabled
            /></label>
            <div id="gallery"></div>
            <p class="notice" data-copy="licence"></p>
          </section>
        </div>
        <hr />
        <button
          id="delete-account"
          class="danger"
          type="button"
          data-copy="deleteAccount"
        ></button>
        <div id="delete-confirm" hidden>
          <p data-copy="deleteWarning"></p>
          <button id="cancel-delete" type="button" data-copy="cancel"></button
          ><button
            id="confirm-delete"
            class="danger"
            type="button"
            data-copy="confirmDelete"
          ></button>
        </div>
      </section>
      <footer>
        <span data-copy="free"></span
        ><a href="mailto:tamad@online.no">tamad@online.no</a>
      </footer>
    </main>
  </body>
</html>
